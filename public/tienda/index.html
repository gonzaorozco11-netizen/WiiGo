<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>WiiGo · Estaciones de Bienestar</title>
<meta name="description" content="La estación de servicio de tu cuerpo: alimentación consciente, suplementación y profesionales. Pedí online y retiralo listo en 15 minutos.">
<!-- Hasta el lanzamiento (etapa 2, parte 5) no aparece en Google. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#22301f">
<link rel="icon" href="/icon.png">
<base href="/tienda/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* El formato de Alifrut (práctico: buscar, ver de a dos y agregar), con los colores de la pantalla asesora:
   crema con un toque durazno, verde bosque, naranja y los tonos de los objetivos. */
:root{
  --fondo:#f5efe3; --carta:#fffaf2; --linea:#ebe1cf; --bosque:#22301f; --bosque2:#2e3f29; --salvia:#b6bca2; --salvia-t:#f0f2ec;
  --energia:#e8743b; --tinta:#1b2219; --gris:#646759; --ef:#3b7a47; --kraft:#c9a072; --sombra:0 6px 18px rgba(34,48,31,.07);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --texto:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#d8d2c3;color:var(--tinta);font:15px/1.4 var(--texto);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--energia);outline-offset:2px}
.app{max-width:440px;min-height:100vh;margin:0 auto;position:relative;padding-bottom:92px}
/* El toque durazno de la pantalla asesora, arriba a la derecha, en toda la página */
body{background:radial-gradient(70% 40% at 100% 0,#f6dcc6 0,rgba(246,220,198,0) 70%) no-repeat,var(--fondo)}

/* Encabezado: menú, logo, cuenta, pedido; buscador; accesos */
.cab{position:sticky;top:0;z-index:20;background:rgba(245,239,227,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 1px 0 var(--linea)}
.hola{font:800 27px/1.02 var(--display);letter-spacing:-.03em;margin:6px 2px 4px;text-wrap:balance}
.hola em{font-style:normal;color:var(--energia)}
.hola-sub{margin:0 2px;color:var(--gris);font-size:14px}
/* Los 3 banners de arriba, uno al lado del otro: se deslizan con el dedo */
.b-pista{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:26px;box-shadow:0 14px 30px rgba(34,48,31,.22)}
.b-pista::-webkit-scrollbar{display:none}
.banner{scroll-snap-align:start;scroll-snap-stop:always;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px;align-items:center;padding:16px 10px 12px 18px;min-height:172px;overflow:hidden;position:relative;cursor:pointer}
/* 3: Unite a WiiGo Club (dorado, con la tarjeta) */
.b-club{background:radial-gradient(70% 90% at 85% 35%,#ffe7a3 0,rgba(255,231,163,0) 70%),linear-gradient(135deg,#f6cf5f,#eab33c);color:#3b2f0e;grid-template-columns:minmax(0,1fr) 132px}
.b-club .hola{color:#2a2207}.b-club .hola em{font-style:normal;color:#22301f;background:linear-gradient(transparent 62%,rgba(232,116,59,.55) 62%);padding:0 2px}
.b-club .hola-sub{color:#5a4510}
.b-chip{display:inline-block;margin-top:8px;background:#22301f;color:#f1c75b;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800}
.b-tarjeta{position:relative;width:132px;height:120px}
.tc{position:absolute;left:8px;top:26px;width:116px;height:74px;border-radius:12px;background:linear-gradient(135deg,#22301f,#3a4d35);border:2px solid #f1c75b;box-shadow:0 10px 22px rgba(59,47,14,.35);transform:rotate(-9deg);overflow:hidden;animation:flotar 4s ease-in-out infinite;color:#f5efe3;padding:8px 10px}
@keyframes flotar{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-5px)}}
.tc-logo{font:800 11px var(--display);letter-spacing:-.01em}
.tc-estrella{position:absolute;right:9px;top:6px;color:#f1c75b;font-size:20px;line-height:1;animation:girar 4s ease-in-out infinite}
@keyframes girar{0%,70%,100%{transform:rotate(0) scale(1)}80%{transform:rotate(72deg) scale(1.25)}}
.tc b{position:absolute;left:10px;bottom:16px;font:800 22px/1 var(--display);color:#f1c75b}
.tc small{position:absolute;left:10px;bottom:5px;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b6bca2}
.tc-brillo{position:absolute;top:-20px;bottom:-20px;width:34px;left:-60px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:skewX(-20deg);animation:brillo 3.2s ease-in-out infinite}
@keyframes brillo{0%,55%{left:-60px}85%,100%{left:150px}}
.burbuja{position:absolute;left:calc(14px + var(--x));bottom:2px;background:#e8743b;color:#fff8ef;font-weight:800;font-size:11.5px;border-radius:999px;padding:2px 8px;opacity:0;animation:subir 3s ease-out infinite;animation-delay:calc(var(--i) * 1s)}
@keyframes subir{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(.9)}}
.chispa-c{position:absolute;color:#fff8ef;font-size:14px;animation:titilar 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * .6s)}
@keyframes titilar{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.banner .hola{font-size:25px;margin:0 0 6px}
.b-pista .carga{border-radius:0;box-shadow:none}
.b-puntos{display:flex;justify-content:center;gap:6px;margin-top:10px}
.b-puntos button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:#d6cdb9;transition:width .25s,background .25s}
.b-puntos button[aria-current="true"]{width:22px;background:var(--bosque)}
/* 2: pedí y retirá en 15 minutos (naranja) */
.b-15{background:radial-gradient(90% 120% at 100% 0,#f19a64 0,rgba(241,154,100,0) 70%),var(--energia);color:#2a1406;grid-template-columns:1fr;padding-right:16px}
.b-15 .hola{color:#2a1406;padding-right:96px;margin-bottom:2px}.b-15 .hola em{font-style:normal;color:#fff8ef}
/* El cronómetro: corre de 00:00 hasta el minuto de cada paso */
.b-crono{position:absolute;top:0;right:0;background:#2a1406;color:#fff8ef;border-radius:16px;padding:8px 10px 6px;text-align:center;min-width:86px;transition:background .3s}
.b-crono b{display:block;font:700 22px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.b-crono small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#f6b48c;margin-top:3px}
.b-crono.listo{background:#22301f}
.b-crono.listo small{color:#a8c08a}
.b-crono.listo small::before{content:"¡Listo! ";color:#fff8ef}
.b-15>div{position:relative}
.b-pasos{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px}
.b-linea{position:absolute;top:19px;left:12.5%;right:12.5%;height:4px;border-radius:4px;background:rgba(42,20,6,.2)}
.b-linea i{display:block;height:100%;width:0;border-radius:4px;background:#2a1406;transition:width .6s ease}
.b-paso{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.b-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff8ef;color:#c4581f;box-shadow:0 4px 10px rgba(42,20,6,.18);transition:background .3s,color .3s,transform .3s}
.b-paso.hecho .b-ic{background:#2a1406;color:#fff8ef;transform:scale(1.1)}
.b-paso small{font-size:11.5px;font-weight:800;color:#2a1406}
.b-paso em{font-style:normal;font-size:10.5px;font-weight:800;color:#7a3a14;opacity:.75}
.b-boton{margin-top:14px;border:0;border-radius:12px;background:#2a1406;color:#fff8ef;font-weight:800;font-size:14px;padding:10px 14px;display:inline-flex;align-items:center;gap:6px}
.b-boton.claro{background:#f1c75b;color:#3b2f0e}
.b-boton.naranja{background:var(--energia);color:#2a1406}
.banner .b-boton svg{width:16px;height:16px;flex-shrink:0}
.b-ceja{margin:0 0 6px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a8d4cf}
/* 3: el futuro del retail saludable (verde azulado) */
.b-futuro{background:radial-gradient(90% 120% at 100% 100%,#548a8c 0,rgba(84,138,140,0) 70%),#3f6b6d;color:#eef5f2}
.b-futuro .hola{color:#f5efe3}.b-futuro .hola em{font-style:normal;color:#f1c75b}.b-futuro .hola-sub{color:#d3e3e0}
.b-red{width:128px;height:auto}
.b-hilo{stroke:rgba(245,239,227,.55);stroke-width:2;fill:none;stroke-dasharray:3 6;animation:hilo 1.1s linear infinite}
.b-nodo{animation:latir 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * .48s);transform-box:fill-box;transform-origin:center}
.b-futuro .b-red{width:136px}
.b-futuro{grid-template-columns:minmax(0,1fr) 136px}
@keyframes latir{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
.b-onda{fill:none;stroke:#f5efe3;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:onda 2.4s ease-out infinite}
@keyframes onda{from{transform:scale(1);opacity:.7}to{transform:scale(1.8);opacity:0}}
@keyframes hilo{to{stroke-dashoffset:-18}}
/* Arriba de todo: una persona cargando energía en una estación WiiGo */
.carga{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:6px;align-items:center;background:radial-gradient(90% 120% at 100% 100%,#3a4d35 0,rgba(58,77,53,0) 70%),var(--bosque);color:#f5efe3;border-radius:26px;padding:16px 10px 10px 18px;box-shadow:0 14px 30px rgba(34,48,31,.22);overflow:hidden}
.carga .hola{font-size:25px;margin:0 0 6px;color:#f5efe3}
.carga .hola-sub{color:#c9cfbd}
.carga svg{width:128px;height:auto;display:block}
.carga .nivel{transform-box:fill-box;transform-origin:50% 100%;animation:llenar 3.2s ease-in-out infinite}
@keyframes llenar{0%{transform:scaleY(.12);fill:#e8743b}45%{fill:#f1c75b}70%,100%{transform:scaleY(1);fill:#7fb069}}
.carga .flujo{stroke-dasharray:3 9;animation:flujo .7s linear infinite}
@keyframes flujo{to{stroke-dashoffset:-24}}
.carga .chispa{opacity:0;animation:chispa 3.2s ease-out infinite}
.carga .chispa.b{animation-delay:.12s}.carga .chispa.c{animation-delay:.24s}
@keyframes chispa{0%,66%{opacity:0;transform:translateY(4px)}76%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.carga .rayo-pantalla{animation:titila 1.6s steps(2) infinite}
@keyframes titila{50%{opacity:.35}}
/* Batería llena: salta y saca músculo (Gonzalo, 16/11). Mismo ciclo de 3,2 s que la batería. */
.carga .persona{animation:salto 3.2s ease-in-out infinite}
@keyframes salto{0%,68%,100%{transform:translateY(0)}75%{transform:translateY(-8px)}82%{transform:translateY(0)}88%{transform:translateY(-4px)}94%{transform:translateY(0)}}
.carga .brazo-normal{animation:brazoNormal 3.2s infinite}
.carga .brazo-fuerza{opacity:0;animation:brazoFuerza 3.2s infinite}
@keyframes brazoNormal{0%,66%,100%{opacity:1}69%,97%{opacity:0}}
@keyframes brazoFuerza{0%,66%,100%{opacity:0}69%,97%{opacity:1}}
.carga .biceps{transform-box:fill-box;transform-origin:50% 80%;animation:biceps 3.2s ease-in-out infinite}
@keyframes biceps{0%,70%,100%{transform:scale(1)}76%{transform:scale(1.4)}82%{transform:scale(1.1)}88%{transform:scale(1.35)}94%{transform:scale(1)}}
.carga .fuerza{opacity:0;animation:chispa 3.2s ease-out infinite;animation-delay:.1s}
@media (prefers-reduced-motion:reduce){.carga .nivel{transform:none;fill:#7fb069}.carga .brazo-fuerza{opacity:0}.carga .brazo-normal{opacity:1}}
.cab-fila{display:flex;align-items:center;gap:10px}
.cab-fila .logo{height:30px;width:auto;display:block}
.redondo{width:44px;height:44px;border-radius:50%;border:0;background:var(--carta);display:grid;place-items:center;flex-shrink:0;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.redondo .n{position:absolute;top:-3px;right:-3px;background:var(--energia);color:#2a1406;border-radius:999px;min-width:20px;height:20px;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.espacio{flex:1}
.buscar{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:0 14px;height:50px}
.buscar input{flex:1;border:0;background:none;font:500 16px var(--texto);color:var(--tinta);min-width:0;outline:none}
.buscar input::placeholder{color:#7d8478}
.buscar .limpiar{border:0;background:none;color:var(--gris);padding:6px}
.accesos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -14px 0;padding:10px 14px 2px}
/* Objetivos: los botones de colores, de a dos */
.objetivos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.objetivo{border:0;border-radius:20px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;position:relative;overflow:hidden}
.objetivo::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;bottom:-36px;background:rgba(255,255,255,.16)}
.objetivo b{font:800 18px/1.05 var(--display);position:relative}
.objetivo span{font-size:12.5px;font-weight:700;opacity:.85;position:relative;margin-top:3px}
@media (min-width:760px){.objetivos{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.objetivo{min-height:140px}.objetivo b{font-size:22px}}
.accesos::-webkit-scrollbar{display:none}
.acceso{flex-shrink:0;border:1px solid var(--linea);background:var(--carta);border-radius:999px;padding:8px 13px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;position:relative}
.acceso[aria-pressed="true"]{background:var(--bosque);color:#f5f1e8;border-color:var(--bosque)}
.acceso .n{position:absolute;top:-7px;left:22px;background:#d6352a;color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:0 6px;line-height:18px}

main{padding:14px}
.seccion{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font:800 22px/1 var(--display);letter-spacing:-.02em}
.seccion::before{content:"";width:5px;height:22px;border-radius:4px;background:var(--energia);flex-shrink:0}
.seccion::after{content:"";flex:1;height:1px;background:var(--linea)}
.filtro-cab{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.filtro-cab b{font:800 20px/1.1 var(--display);letter-spacing:-.01em}
.filtro-cab small{display:block;color:var(--gris);font-size:13px;font-weight:600}

/* Tarjeta de producto, de a dos */
.grilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.carrusel{display:grid;grid-auto-flow:column;grid-auto-columns:calc(50% - 5px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.carrusel::-webkit-scrollbar{display:none}
.carrusel>.tarjeta{scroll-snap-align:start}
.tarjeta{background:var(--carta);border:1px solid var(--linea);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sombra)}
/* La info nutricional, chiquita: kcal y macros cada 100 g */
.t-nutri{display:flex;flex-wrap:wrap;gap:4px}
.t-nutri span{background:var(--fondo);border-radius:7px;padding:2px 6px;font-size:11px;font-weight:700;color:var(--gris);white-space:nowrap}
.t-nutri span.kcal{background:#fde3d4;color:#a8461a}
.t-nutri span.por{background:none;padding:2px 2px;font-weight:600;color:#8a8f82}
.f-desc{margin:10px 0 0;color:var(--gris);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.f-desc.abierta{display:block}
.f-nutri{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.f-nutri div{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:7px 4px;text-align:center}
.f-nutri div.kcal{background:#fde3d4;border-color:#f6c9ad}
.f-nutri small{display:block;font-size:10.5px;color:var(--gris);font-weight:700}
.f-nutri b{font:800 15px var(--display)}
.f-chico{font-size:12.5px;color:var(--gris);margin:10px 2px 0;line-height:1.4}
/* El planeta en «Del mundo» */
.mundo{background:radial-gradient(ellipse at 50% 40%,#0d1a2b 0%,#05080d 72%);border-radius:24px;margin-bottom:12px;overflow:hidden;position:relative}
.mundo .globo{position:relative;aspect-ratio:1;width:100%;touch-action:pan-y;cursor:grab}
.mundo canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.mundo .etiquetas{position:absolute;inset:0;pointer-events:none;z-index:1}
.mundo .pin{position:absolute;left:0;top:0;pointer-events:auto;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px 5px 7px;display:inline-flex;align-items:center;gap:7px;background:rgba(8,14,22,.78);color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap;transition:opacity .25s}
.mundo .pin i{width:9px;height:9px;border-radius:50%;background:var(--energia);box-shadow:0 0 0 4px rgba(232,116,59,.3)}
.mundo .pin[aria-pressed="true"]{background:var(--energia);color:#2a1406}
.mundo .pin[aria-pressed="true"] i{background:#fff}
.mundo .pin.izq{flex-direction:row-reverse;padding:5px 7px 5px 11px}
.mundo .pin.punto{font-size:0;gap:0;padding:6px;background:transparent;border-color:transparent}
.mundo-txt{position:absolute;left:16px;right:16px;bottom:14px;color:#e8eef5;pointer-events:none}
.mundo-txt b{font:800 22px/1.05 var(--display)}
.mundo-txt span{display:block;font-size:12.5px;color:#b9c6d6;margin-top:3px}
.liviano{background:url(img/tierra-liviana.jpg) 0 50%/200% 100% repeat-x;border-radius:50%;width:70%;margin:12% auto;aspect-ratio:1;box-shadow:inset -30px -16px 60px rgba(0,0,0,.7),0 0 40px rgba(120,170,255,.35);animation:plano 60s linear infinite}
@keyframes plano{to{background-position:-200% 50%}}
.tonos .acceso{border:0}
.t-arriba{position:relative;padding:10px 10px 0;border-bottom:1px solid var(--linea)}
.t-rubro{font-size:11.5px;color:var(--gris);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t-foto{border:0;background:none;padding:0;width:100%;aspect-ratio:1;display:grid;place-items:center}
.t-foto img{width:84%;height:84%;object-fit:contain}
.kraft{width:76%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--kraft);color:#fffdf8;font:800 14px/1.1 var(--display);text-align:center;padding:10px}
.t-marca{position:absolute;left:10px;bottom:8px;background:var(--salvia-t);color:#3f5536;border:1px solid #d7dcc8;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800;max-width:calc(100% - 64px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ver{position:absolute;right:8px;bottom:6px;width:36px;height:36px;border-radius:50%;border:1px solid var(--linea);background:var(--carta);display:grid;place-items:center;color:var(--bosque2)}
.t-etq{position:absolute;top:28px;left:10px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.t-etq.sin{background:#2b2b2b;color:#fff}
.t-etq.poco{background:#fff1d6;color:#7a4a00}
.t-cuerpo{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.t-nombre{font-weight:800;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.t-sabores{display:flex;gap:6px;flex-wrap:wrap}
.t-sabores button{border:1px solid var(--linea);background:var(--carta);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;flex:1 1 40%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sabores button[aria-pressed="true"]{border-color:var(--bosque);background:var(--salvia-t);box-shadow:inset 0 0 0 1px var(--bosque)}
.t-sabores button[disabled]{opacity:.4;text-decoration:line-through}
.t-precio{margin-top:auto}
.t-precio b{display:block;font:800 22px/1.1 var(--display);letter-spacing:-.02em}
.t-precio span{display:block;color:var(--ef);font-weight:800;font-size:13.5px}
.agregar{border:0;border-radius:14px;background:var(--bosque);color:#f5f1e8;min-height:46px;font-weight:800;font-size:16px;width:100%}
.agregar[disabled]{background:#e6e1d5;color:#8e9187}
.paso{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;background:var(--bosque);color:#f5f1e8;border-radius:14px;min-height:46px;overflow:hidden}
.paso button{border:0;background:none;color:inherit;height:46px;font-size:22px;font-weight:800}
/* Formato de app de delivery (16/11): texto a la izquierda, foto a la derecha con el «+» encima */
.items{display:grid;column-gap:22px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:14px;padding:14px 0;border-bottom:1px solid var(--linea);align-items:start}
.it-tx{border:0;background:none;padding:0;text-align:left;color:inherit;display:grid;gap:3px;justify-items:start;min-width:0}
.it-nom{font-weight:800;font-size:15px;line-height:1.25}
.it-mar{font-size:12px;font-weight:700;color:var(--gris)}
.it-des{font-size:13px;color:var(--gris);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-kcal{font-size:11.5px;font-weight:700;color:#a8461a;background:#fde3d4;border-radius:7px;padding:1px 7px;margin-top:2px}
.it-pr{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:3px}
.it-pr b{font:800 18px/1.1 var(--display);letter-spacing:-.01em}
.it-pr span{font-size:12.5px;font-weight:800;color:var(--ef)}
.it-poco{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:#fff1d6;color:#7a4a00}
.it-sin{font-size:12px;font-weight:700;color:var(--gris);background:#ece6da;border-radius:999px;padding:2px 9px;margin-top:4px}
.it-ft{position:relative;width:104px;height:104px}
.it-foto{border:1px solid #f1ebdf;background:#fff;padding:0;width:104px;height:104px;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.it-foto img{width:90%;height:90%;object-fit:contain}
.it-foto .kraft{width:100%;height:100%;border-radius:14px;font-size:11px;padding:8px}
.item.sin .it-foto img{filter:grayscale(1);opacity:.6}
.it-acc{position:absolute;right:-4px;bottom:-8px}
.it-mas{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--bosque);font-size:25px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18);border:1px solid var(--linea)}
.it-mas.con{background:var(--bosque);color:#f5f1e8;font-size:16px;font-weight:800;border-color:var(--bosque)}
.it-paso{display:flex;align-items:center;background:var(--bosque);color:#f5f1e8;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.it-paso button{border:0;background:none;color:inherit;width:34px;height:36px;font-size:20px;font-weight:800}
.it-paso span{font-weight:800;font-size:15px;min-width:14px;text-align:center}
/* El local, los accesos, las pestañas de rubros y las marcas */
.local{margin-top:14px;background:var(--carta);border:1px solid var(--linea);border-radius:20px;box-shadow:var(--sombra);padding:14px 16px 12px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px}
.local-logo{width:56px;height:56px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;font:800 26px var(--display);color:var(--bosque);box-shadow:0 2px 8px rgba(34,48,31,.12)}
/* El logo ocupa todo el cuadro (Gonzalo, 16/11: «que no se vea como un cuadrado adentro de otro») */
.local-logo img{width:100%;height:100%;object-fit:cover}
.local h2{margin:0;font:800 20px/1.1 var(--display);color:var(--bosque)}
.local-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12.5px;color:var(--gris);font-weight:600}
.local-meta .abierto{color:var(--ef)}.local-meta .cerrado{color:#b54a2b}
.local-datos{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--linea);padding-top:10px}
.local-datos span{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--salvia-t);color:var(--bosque)}
.local-datos span.club{background:#fff4d6;color:#7a5200}
/* Pie: redes y la información legal plegada (16/11) */
.redes{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.redes .red{display:flex;align-items:center;gap:9px;background:var(--bosque);color:#f5efe3;border-radius:14px;padding:9px 14px 9px 12px;text-decoration:none;font-weight:800;font-size:14px;line-height:1.1}
.redes .red span{display:grid}
.redes .red small{font-weight:600;font-size:12px;color:rgba(255,255,255,.82)}
.redes .red-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);color:#fff}
.redes .red-tt{background:#010101;color:#fff}
.legal{font-size:12px;color:var(--gris)}
.legal summary{cursor:pointer;font-weight:700;list-style:none;text-decoration:underline;text-underline-offset:2px;width:max-content}
.legal summary::-webkit-details-marker{display:none}
.legal[open] summary{margin-bottom:6px}
.legal span,.legal a{display:block;margin-top:4px;color:var(--gris)}
/* La dirección abre el mapa (16/11) */
a.dir-mapa{color:inherit;text-decoration:none}
a.dir-mapa u{text-decoration:underline;text-underline-offset:2px;color:#3f5536;font-weight:800}
.nota a.dir-mapa{text-decoration:underline;text-underline-offset:2px;font-weight:800}
/* Los accesos en una fila que se desliza (16/11): entran Ofertas, Combos y lo que venga */
.accesos-ini{display:flex;gap:8px;margin:4px -14px 0;padding:8px 14px 2px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 14px}
.accesos-ini::-webkit-scrollbar{display:none}
.accesos-ini button{flex:none;width:78px;position:relative;scroll-snap-align:start;display:grid;justify-items:center;gap:4px;background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:10px 4px;font-size:12px;font-weight:800;color:var(--bosque);line-height:1.15;text-align:center}
.accesos-ini em{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:10.5px;font-weight:800;background:var(--energia);color:#fff;border-radius:999px;padding:1px 7px}
.accesos-ini em.pronto{background:#d9d2c3;color:#4b5244}
.accesos-ini span{font-size:24px}
.tabs-rubros{position:sticky;top:var(--alto-cab,128px);z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:14px -14px 0;padding:0 10px;background:rgba(245,239,227,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.tabs-rubros::-webkit-scrollbar{display:none}
.tab-r{flex:none;border:0;background:none;padding:11px 11px 10px;font-weight:800;font-size:14px;color:var(--gris);border-bottom:3px solid transparent;white-space:nowrap}
.tab-r[aria-current="true"]{color:var(--bosque);border-bottom-color:var(--energia)}
.marcas-ini{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -14px 0;padding:2px 14px}
.marcas-ini::-webkit-scrollbar{display:none}
.marca-p{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--linea);border-radius:999px;padding:4px 13px 4px 4px;font-weight:800;font-size:13.5px;background:var(--carta)}
.marca-p img,.marca-p i{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--linea);display:grid;place-items:center;font-style:normal}
.marca-p[aria-pressed="true"]{background:var(--bosque);border-color:var(--bosque);color:#f5f1e8}
.rubro-sec{scroll-margin-top:calc(var(--alto-cab,128px) + var(--alto-pegado,48px) + 6px)}
/* Arriba, como la maqueta (16/11): la tarjeta del local montada sobre el borde de abajo del banner */
.ini-top{position:relative}
.ini-top .banner{padding-bottom:52px;min-height:206px}
.ini-top .b-puntos{position:relative;z-index:3;margin-top:-44px;margin-bottom:18px}
.ini-top .b-puntos button{background:rgba(255,255,255,.55)}
.ini-top .b-puntos button[aria-current="true"]{background:#fff}
.ini-top .local{position:relative;z-index:2;margin:0 12px}
/* El buscador con las pestañas, abajo de los accesos y pegados arriba al bajar */
.pegado-ini{position:sticky;top:var(--alto-cab,64px);z-index:15;margin:12px -14px 0;padding:10px 14px 0;background:rgba(245,239,227,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.pegado-ini .buscar{margin-top:0}
.pegado-ini .marcas-ini{margin:0 -14px 0;padding:2px 14px 2px}
/* Las marcas, un poco más grandes en el celu (Gonzalo, 16/11) */
.pegado-ini .marca-p{padding:5px 16px 5px 5px;font-size:15px;gap:9px}
.pegado-ini .marca-p img,.pegado-ini .marca-p i{width:36px;height:36px}
.mp-tx{display:grid;line-height:1.1;text-align:left}
.mp-tx b{font-weight:800}
.mp-tx small{font-size:11px;font-weight:700;color:var(--gris)}
.marca-p[aria-pressed="true"] .mp-tx small{color:#c9cfbd}
.pegado-ini .tabs-rubros{position:static;margin:4px -14px 0;background:none;border-bottom:0;backdrop-filter:none;-webkit-backdrop-filter:none}
/* Las categorías de la marca elegida: pastillas con fotito, pegadas arriba; tocar una muestra solo esa (16/11) */
.tabs-rubros.pastillas{gap:6px;padding:4px 10px 8px}
.pastilla{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea);background:var(--carta);border-radius:999px;padding:3px 11px 3px 3px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--bosque)}
.pastilla img{width:28px;height:28px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--linea)}
.pastilla em{font-style:normal;color:var(--gris);font-size:12px;font-weight:600}
.pastilla[aria-current="true"]{background:var(--bosque);border-color:var(--bosque);color:#f5f1e8}
.pastilla[aria-current="true"] em{color:#c9cfbd}
.rub-cant{margin:-6px 0 0;color:var(--gris);font-size:12.5px;font-weight:600}
.sub-rub{margin:18px 0 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
/* «Lo más elegido»: tarjetas que se deslizan, con el «+» sobre la foto */
.elegidos{display:grid;grid-auto-flow:column;grid-auto-columns:148px;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px}
.elegidos::-webkit-scrollbar{display:none}
.eleg .it-ft,.eleg .it-foto{width:148px;height:148px}
.eleg-tx{border:0;background:none;padding:0;text-align:left;color:inherit;display:grid;gap:2px;margin-top:10px;width:100%}
.eleg-tx span{font-weight:700;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eleg-tx b{font:800 16px var(--display)}
.paso span{text-align:center;font-weight:800;font-size:16px}
.ver-mas{width:100%;margin-top:14px;border:1px solid var(--linea);background:var(--carta);border-radius:14px;min-height:48px;font-weight:800}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}

/* Menú de la izquierda: marcas y sus rubros */
.fondo{position:fixed;inset:0;background:rgba(24,35,26,.45);z-index:40}
.cajon{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(340px,86vw);background:#eef0e8;display:flex;flex-direction:column;animation:izq .25s cubic-bezier(.2,.8,.2,1)}
@keyframes izq{from{transform:translateX(-100%)}}
.cajon-cab{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 10px}
.cajon-cab b{display:block;font:800 22px/1 var(--display);color:var(--bosque)}
.cajon-cab small{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.cajon .buscar{margin:0 14px 8px;height:46px}
.cajon-lista{flex:1;overflow:auto;padding:0 8px 24px}
.cajon-lista p{margin:16px 10px 4px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.c-fila{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid #dfe2d6;background:none;text-align:left;padding:13px 10px;font-size:15.5px;font-weight:600}
.c-fila img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0}
.c-fila .cant{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;color:var(--bosque2)}
.c-fila svg{flex-shrink:0;transition:transform .2s;color:var(--gris)}
.c-fila[aria-expanded="true"] svg{transform:rotate(180deg)}
.c-subs{background:#fff;border-radius:14px;margin:4px 0 6px}
.c-subs .c-fila{font-size:14.5px;padding:11px 14px;border-bottom-color:#eceee6}

/* Ficha y pedido: hojas que suben */
/* Con el teclado del celu abierto, la hoja se apoya arriba del teclado y entra en lo que queda visible
   (--teclado y --alto-visible los pone app.js con visualViewport; Gonzalo 16/11: «choca con el teclado»).
   La hoja sigue pegada abajo y el teclado se cubre con su propio relleno: así no queda un hueco con la página
   asomando entre la hoja y el teclado (se veía en el iPhone). */
.hoja{position:fixed;left:0;right:0;bottom:0;padding-bottom:var(--teclado,0px);z-index:41;max-width:440px;margin:0 auto;background:var(--fondo);border-radius:26px 26px 0 0;max-height:calc(var(--alto-visible,100vh) * .92 + var(--teclado,0px));display:flex;flex-direction:column;animation:sube .28s cubic-bezier(.2,.8,.2,1)}
.pasos-cuenta{margin:0 0 16px;padding:0 0 0 22px;display:grid;gap:6px;font-size:14px;color:var(--tinta)}
.pasos-cuenta li::marker{font-weight:800;color:var(--energia)}
.bienvenida{background:#fff4d6;border-radius:20px;padding:16px;margin-bottom:12px;display:grid;gap:8px;color:#4a3606}
.bienvenida>b{font:800 20px/1.15 var(--display)}
.bienvenida ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px}
@keyframes sube{from{transform:translateY(100%)}}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.hoja-cab h2{margin:0;font:800 24px/1.1 var(--display)}
.hoja-cuerpo{overflow:auto;padding:0 16px 16px}
.hoja-pie{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--linea);display:grid;gap:8px;background:var(--carta)}
.f-foto{background:#fff;border-radius:22px;aspect-ratio:1/.8;display:grid;place-items:center;border:1px solid var(--linea)}
.f-foto img{width:78%;height:78%;object-fit:contain}
.f-nombre{font:800 24px/1.1 var(--display);margin:14px 0 2px;letter-spacing:-.02em}
.f-de{color:var(--gris);font-size:13.5px;font-weight:700}
.f-precio{margin:12px 0}
.f-precio b{font:800 30px var(--display);letter-spacing:-.02em;display:block}
.f-precio span{color:var(--ef);font-weight:800;font-size:16px}
.f-texto{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-top:12px;font-size:14.5px}
.f-texto p{margin:0 0 8px}.f-texto p:last-child{margin:0}
.f-texto h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.macros div{background:var(--fondo);border-radius:10px;padding:8px;text-align:center}
.macros small{display:block;font-size:11px;color:var(--gris);font-weight:700}
.macros b{font:800 16px var(--display)}
.linea-ped{display:grid;grid-template-columns:56px minmax(0,1fr) 120px;gap:10px;align-items:center;background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:8px;margin-bottom:8px}
.linea-ped .mini{width:56px;height:56px;display:grid;place-items:center}
.linea-ped .mini img{width:100%;height:100%;object-fit:contain}
.linea-ped .kraft{width:100%;font-size:8px;padding:4px;border-radius:10px}
.linea-ped b{font-size:13.5px;line-height:1.25;display:block}
.linea-ped small{color:var(--gris);font-size:12px}
.linea-ped .paso{grid-template-columns:36px 1fr 36px;min-height:38px}
.linea-ped .paso button{height:38px;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total b{font:800 22px var(--display)}
.total.ef b{color:var(--ef);font-size:19px}
.nota{background:#fff6dc;border:1px solid #f0dca0;border-radius:12px;padding:9px 12px;font-size:13px}

/* Barra del pedido */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto}
.barra button{width:100%;border:0;border-radius:18px;background:var(--bosque);color:#f5f1e8;min-height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:15.5px;box-shadow:0 14px 30px rgba(24,35,26,.3)}
.barra button span{display:flex;align-items:center;gap:8px}
.barra button span:last-child{color:#f1c75b}
/* barra naranja */
.barra button{background:var(--energia);color:#2a1406;box-shadow:0 14px 30px rgba(232,116,59,.35)}
.barra button span:last-child{color:#2a1406;background:#fff8ef;border-radius:999px;padding:6px 12px}
.barra button span{white-space:nowrap}
.barra button span:last-child{font-size:14px;padding:6px 10px}

.pie{background:var(--carta);margin:28px -14px -14px;padding:22px 18px 30px;border-top:1px solid var(--linea);display:grid;gap:8px;font-size:14px;color:var(--gris)}
.pie img{height:30px;width:auto;justify-self:start}
.pie b{color:var(--tinta)}
/* Cuenta WiiGo Club (parte 2) */
.form{display:grid;gap:12px}
.campo{display:grid;gap:5px;font-size:13px;font-weight:800;color:var(--gris)}
.campo input{height:50px;border:1.5px solid var(--linea);border-radius:14px;background:var(--carta);padding:0 14px;font:600 16px var(--texto);color:var(--tinta);width:100%}
.campo input:focus{border-color:var(--bosque);outline:none}
.campo input[readonly]{background:var(--fondo);color:var(--gris)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tilde{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tinta);font-weight:600;line-height:1.35}
.tilde input{width:22px;height:22px;accent-color:var(--bosque);margin:0;flex-shrink:0}
.tilde small{display:block;color:var(--gris);font-weight:500;font-size:12.5px}
.codigo{font:800 30px var(--display)!important;letter-spacing:.35em;text-align:center}
.cta{border:0;border-radius:16px;min-height:54px;background:var(--bosque);color:#f5f1e8;font-weight:800;font-size:16px;width:100%}
.cta.naranja{background:var(--energia);color:#2a1406}
.texto-cuenta{color:var(--gris);font-size:14.5px;margin:0 0 14px}
.prueba{background:#fff6dc;border:1px dashed #e2c46e;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#6b5414;margin-top:14px}
.club{background:radial-gradient(90% 120% at 100% 100%,#3a4d35 0,rgba(58,77,53,0) 70%),var(--bosque);color:#f5efe3;border-radius:22px;padding:18px;display:grid;gap:4px}
.club small{color:#c9cfbd;font-size:13px}
.club b{font:800 40px/1 var(--display);letter-spacing:-.02em;color:#f1c75b}
.club span{font-size:13px;color:#c9cfbd}
.sub-cuenta{margin:20px 2px 8px;font:800 18px var(--display)}
.compra{background:var(--carta);border:1px solid var(--linea);border-radius:16px;margin-bottom:8px;overflow:hidden}
.compra-cab{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:12px 12px 12px 14px;text-align:left}
.compra-cab b{display:block;font:800 19px var(--display)}
.compra-cab small{display:block;color:var(--gris);font-size:12.5px}
.compra-cab svg{color:var(--gris);transition:transform .2s}
.compra-cab[aria-expanded="true"] svg{transform:rotate(180deg)}
.compra .pts{text-align:right;font-weight:800;font-size:15px;color:#a8461a}
.compra .pts span{display:block;font-size:11.5px}
.compra-items{border-top:1px solid var(--linea);padding:8px 12px 12px;background:#fffdf8}
.compra-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.compra-item .mini{width:40px;height:40px;display:grid;place-items:center}
.compra-item .mini img{width:100%;height:100%;object-fit:contain}
.compra-item .kraft{width:100%;font-size:6px;padding:2px;border-radius:8px}
.dato{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--linea);font-size:14.5px}
.dato span{color:var(--gris)}
.cab-cuenta{border:0;width:52px;height:44px;border-radius:999px;background:var(--bosque);color:#f5efe3;display:grid;place-items:center;flex-shrink:0}
.cab-pedido{border:0;height:44px;border-radius:999px;background:var(--energia);color:#fff;display:flex;align-items:center;gap:6px;padding:0 15px 0 13px;font-weight:800;font-size:15px;flex-shrink:0}
.pts-cab{border:0;border-radius:999px;background:#f1c75b;color:#3b2f0e;font-weight:800;font-size:13px;height:44px;padding:0 12px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.aviso{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Parte 3: finalizar la compra y seguir el pedido (maqueta aprobada, 2026-11-16) */
.f-chico{font-size:12.5px;color:var(--gris);margin:10px 2px 0;line-height:1.4}
.opciones{display:grid;gap:8px}
.opcion{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--linea);background:var(--carta);border-radius:16px;padding:14px;width:100%;color:inherit;font:inherit}
.opcion[aria-pressed="true"]{border-color:var(--bosque);box-shadow:inset 0 0 0 1px var(--bosque)}
.opcion[disabled]{opacity:.55}
.opcion b{display:block;font-size:15.5px}
.opcion small{display:block;color:var(--gris);font-size:13px;margin-top:2px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #b9b09c;flex-shrink:0;margin-top:1px}
.opcion[aria-pressed="true"] .radio{border:7px solid var(--bosque)}
.pronto{display:inline-block;background:#f1c75b;color:#3b2f0e;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;vertical-align:middle}
.resumen{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.seg-codigo{background:var(--bosque);color:#f5efe3;border-radius:22px;padding:18px;text-align:center;display:grid;gap:4px}
.seg-codigo small{color:#c9cfbd;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.seg-codigo b{font:700 38px/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;color:#f1c75b}
.seg-codigo span{font-size:13.5px;color:#c9cfbd}
.seg-estado{margin:14px 0;background:var(--carta);border:1px solid var(--linea);border-radius:18px;padding:16px;display:grid;gap:4px}
.seg-estado b{font:800 24px var(--display)}
.seg-estado span{color:var(--gris)}
.seg-estado em{font-style:normal;font-weight:800;color:#a8461a}
.seg-pasos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.seg-pasos li{display:flex;align-items:center;gap:12px;color:var(--gris);font-weight:700}
.seg-pasos i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9e1cf;font-style:normal;font-size:13px;font-weight:800}
.seg-pasos li.hecho{color:var(--tinta)}.seg-pasos li.hecho i{background:var(--bosque);color:#f5efe3}
.seg-pasos li.ahora{color:var(--tinta)}.seg-pasos li.ahora i{background:var(--energia);color:#2a1406;box-shadow:0 0 0 5px rgba(232,116,59,.25)}
.seg-falta{background:#fff6dc;border:1px solid #f0dca0;border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:grid;gap:2px}
.seg-items{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:10px 14px;display:grid;gap:4px;margin-top:14px;font-size:14px}
.seg-items s{color:var(--gris)}
.transf{background:#fff6dc;border:1.5px solid #f0d58a;border-radius:20px;padding:16px;margin-bottom:12px;display:grid;gap:6px}
.transf>small{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a5c12}
.transf>b{font:800 34px/1 var(--display);color:#2a2207}
.dato-t{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;align-items:center;background:#fffdf6;border-radius:12px;padding:8px 10px;font-size:14px}
.dato-t span{color:var(--gris);font-size:12.5px;font-weight:700}
.dato-t b{overflow-wrap:anywhere}
.dato-t .acceso{padding:5px 10px;font-size:12.5px}
.estacion3d{background:radial-gradient(circle at 50% 35%,#2d4030,#18231a 72%);border-radius:22px;overflow:hidden;margin-bottom:12px}
.estacion3d .tablero{position:relative;aspect-ratio:16/11}
.estacion3d svg{position:absolute;inset:0;width:100%;height:100%}
.esc *{transform-box:fill-box;transform-origin:center}
@keyframes e-onda{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes e-ticket{0%{transform:translateY(0)}60%,100%{transform:translateY(-18px)}}
@keyframes e-rebote{50%{transform:translateY(-9px)}}
@keyframes e-paso{50%{transform:translateY(-3px)}}
@keyframes e-caminar{0%,100%{transform:translate(0,0)}45%,55%{transform:translate(-118px,-50px)}}
@keyframes e-saltar{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(84px,30px);opacity:0}}
@keyframes e-titila{50%{opacity:.2}}
@keyframes e-escanear{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes e-entrega{0%{transform:translate(0,0)}100%{transform:translate(44px,22px)}}
@keyframes e-confeti{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(320px) rotate(400deg)}}
@keyframes e-subePts{0%{transform:translateY(12px);opacity:0}30%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
/* En la compu: el mismo recorrido, más ancho. Va al final para ganarle a las reglas del celu. */
@media (min-width:760px){
  .app{max-width:1180px;padding:0 8px 100px}
  main{padding:18px 22px}
  .cab{padding-left:22px;padding-right:22px;background:rgba(245,239,227,.96)}
  /* La barra de arriba llega de borde a borde aunque la página tenga ancho máximo */
  .cab::before{content:"";position:absolute;top:0;bottom:0;left:-100vmax;right:-100vmax;background:inherit;box-shadow:0 1px 0 var(--linea);z-index:-1}
  body{overflow-x:hidden}
  .grilla{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  /* En la compu, los productos de a dos columnas */
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .accesos-ini{max-width:640px}
  .tabs-rubros{margin-left:-22px;margin-right:-22px;padding:0 18px}
  .carrusel{grid-auto-columns:220px;gap:14px}
  .carga{grid-template-columns:minmax(0,1fr) 170px;padding:22px 30px 14px 34px}
  .banner{min-height:200px;padding-left:34px;padding-right:30px}
  .banner .hola{font-size:36px}
  .carga .hola-sub,.b-club .hola-sub{font-size:16px}
  .carga svg{width:170px}
  .b-15>div{max-width:680px}
  .b-15 .hola{padding-right:0}
  .b-15 .b-crono{right:-250px;top:50%;transform:translateY(-50%) scale(1.45);transform-origin:center right}
  .b-club{grid-template-columns:minmax(0,1fr) 170px}
  .b-tarjeta{transform:scale(1.15);transform-origin:center}
  .barra,.hoja{max-width:560px}
  .cajon{left:max(0px,calc(50% - 590px))}
  .mundo .globo{max-width:620px;margin:0 auto}
  .pie{margin-left:-22px;margin-right:-22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
